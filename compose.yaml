services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ARTEMIS_DATABASE_PATH: /app/data/artemis_voice.db
    volumes:
      - artemis-data:/app/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  artemis-data:
