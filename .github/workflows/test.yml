name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  artemis:
    name: Artemis evaluator (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check backend
      - run: python -m pytest -q

  studio-backend:
    name: VoiceFlow Studio backend (pytest, sqlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voiceflow-studio/backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # vendor/pipecat is a path dependency in uv.lock
      - name: Check Pipecat submodule
        working-directory: .
        run: ./scripts/check-submodule.sh
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: voiceflow-studio/backend/uv.lock
      - run: uv sync --frozen
      # No Postgres service: tests/conftest.py falls back to sqlite (aiosqlite) when :5433 is closed.
      - run: uv run pytest -q

  frontends:
    name: Frontend build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: artemis-dashboard
            dir: frontend
          - app: studio-ui
            dir: voiceflow-studio/frontend
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_ARTEMIS_DASHBOARD_URL: http://localhost:5173
      VITE_STUDIO_UI_URL: http://localhost:3000
      VITE_STUDIO_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yaml config -q
      - run: docker compose -f voiceflow-studio/docker-compose.yml config -q
