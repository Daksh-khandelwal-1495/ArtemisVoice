[project]
name = "voiceflow-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pipecat-ai[deepgram,openai,soniox,webrtc,silero,runner]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "loguru>=0.7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "aiosqlite>=0.20"]

[tool.uv.sources]
pipecat-ai = { path = "../vendor/pipecat", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
