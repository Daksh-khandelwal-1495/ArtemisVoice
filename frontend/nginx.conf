server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The dashboard calls /api/*; strip the prefix and forward to the Artemis API
  # container (it listens on 8000 inside the network, published on host 8001).
  location /api/ {
    proxy_pass http://artemis-api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Causal diagnosis runs many replays through Studio; allow long requests.
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
